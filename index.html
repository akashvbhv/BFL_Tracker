<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Traker</title>
    <link rel="manifest" href="data:application/manifest+json,{
        'name': 'Loan Traker',
        'short_name': 'LoanTraker',
        'start_url': '.',
        'display': 'standalone',
        'background_color': '#1e3a8a',
        'theme_color': '#3b82f6',
        'icons': [{'src': 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTkyIiBoZWlnaHQ9IjE5MiIgdmlld0JveD0iMCAwIDE5MiAxOTIiIGZpbGw9Im5vbmUiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+CjxjaXJjbGUgY3g9Ijk2IiBjeT0iOTYiIHI9Ijk2IiBmaWxsPSIjM2I4MmY2Ii8+CjxwYXRoIGQ9Ik0xMjAgMTI1QzEyMCAxMzEuNSA5MiAxMzEuNSA5MiAxMjVDOTIgMTE4LjUgMTIwIDExOC41IDEyMCAxMjVaIiBmaWxsPSJ3aGl0ZSIvPgo8L3N2Zz4K', 'sizes': '192x192', 'type': 'image/svg+xml'}]
    }">
    <meta name="theme-color" content="#3b82f6">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1e3a8a 0%, #7c3aed 100%);
            color: white;
            min-height: 100vh;
            padding: 1rem;
        }
        .header {
            text-align: center;
            margin-bottom: 2rem;
            padding: 1.5rem;
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }
        .header h1 { font-size: 1.8rem; margin-bottom: 0.5rem; }
        .current-date { font-size: 1.1rem; opacity: 0.9; }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .stat-card {
            background: linear-gradient(135deg, rgba(255,255,255,0.2), rgba(255,255,255,0.1));
            padding: 1.5rem;
            border-radius: 20px;
            text-align: center;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
        }
        .stat-value { font-size: 1.5rem; font-weight: bold; margin-bottom: 0.25rem; }
        .stat-label { font-size: 0.8rem; opacity: 0.8; }
        
        .section {
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
        }
        .section h3 { margin-bottom: 1rem; font-size: 1.2rem; }
        
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 1rem;
            margin-bottom: 1rem;
        }
        input, select, button {
            padding: 0.75rem;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            background: rgba(255,255,255,0.9);
            color: #1e3a8a;
        }
        input:focus, select:focus { outline: 2px solid #3b82f6; }
        button {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:hover { transform: translateY(-2px); }
        button:active { transform: translateY(0); }
        
        .btn-group { display: flex; flex-wrap: wrap; gap: 0.75rem; }
        .btn-group button { flex: 1; min-width: 100px; }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
            background: rgba(255,255,255,0.95);
            border-radius: 12px;
            overflow: hidden;
            color: #1e3a8a;
        }
        th, td { padding: 0.75rem; text-align: left; border-bottom: 1px solid #e5e7eb; }
        th { background: #f8fafc; font-weight: 600; }
        .delete-btn {
            background: #ef4444;
            color: white;
            padding: 0.25rem 0.5rem;
            font-size: 0.8rem;
            border-radius: 6px;
        }
        
        #chartContainer { height: 250px; margin: 1rem 0; }
        canvas { max-height: 250px !important; }
        
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 1rem 1.5rem;
            background: #10b981;
            border-radius: 12px;
            color: white;
            transform: translateX(400px);
            transition: transform 0.3s;
            z-index: 1000;
        }
        .notification.show { transform: translateX(0); }
        
        @media (max-width: 480px) {
            .form-grid { grid-template-columns: 1fr; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
        }
        
        .install-prompt {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            padding: 1rem;
            border-radius: 20px;
            text-align: center;
            display: none;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>💰 Loan Traker</h1>
        <div class="current-date" id="currentDate"></div>
    </div>
    
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-value" id="currentBalance">₹0</div>
            <div class="stat-label">Current Balance</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="totalLent">₹0</div>
            <div class="stat-label">Total Lent</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="totalRepaid">₹0</div>
            <div class="stat-label">Total Repaid</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="totalInterest">₹0</div>
            <div class="stat-label">Total Interest</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="interestToday">₹0</div>
            <div class="stat-label">Interest Today</div>
        </div>
    </div>
    
    <div class="section">
        <h3>⚙️ Setup</h3>
        <div class="form-grid">
            <input type="text" id="friendName" placeholder="Friend name">
            <input type="number" id="annualRate" placeholder="Annual Rate %" value="12" step="0.1">
            <input type="date" id="startDate">
            <button onclick="saveSettings()">Save Settings</button>
        </div>
    </div>
    
    <div class="section">
        <h3>➕ Add Transaction</h3>
        <div class="form-grid">
            <input type="text" id="transDate" placeholder="Date (DD-MMM-YYYY)">
            <input type="number" id="transAmount" placeholder="Amount">
            <select id="transType">
                <option value="Loan">Loan (+)</option>
                <option value="Repay">Repay (-)</option>
                <option value="Interest">Interest</option>
            </select>
            <input type="text" id="transComment" placeholder="Comment">
            <button onclick="addTransaction()">Add</button>
        </div>
    </div>
    
    <div class="section">
        <h3>📈 Balance Chart</h3>
        <div id="chartContainer">
            <canvas id="balanceChart"></canvas>
        </div>
    </div>
    
    <div class="section">
        <h3>📋 Transact
