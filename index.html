<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vaibhav's Ledger</title>
  
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>

  <style>
    :root { 
      --primary: #667eea; --secondary: #764ba2; 
      --success: #00d4aa; --danger: #ff6b9d; 
      --warning: #f1c40f; --info: #3498db;
      --dark: #2c3e50;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; color: var(--dark); }
    
    .container { max-width: 1300px; margin: 0 auto; display: grid; grid-template-columns: 260px 1fr; gap: 20px; }
    
    /* Sidebar */
    .sidebar { background: rgba(255,255,255,0.95); border-radius: 15px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); height: fit-content; }
    .sidebar h2 { font-size: 1.1em; margin-bottom: 15px; color: var(--secondary); border-bottom: 2px solid #eee; padding-bottom: 5px; text-transform: uppercase; }
    .person-item { padding: 12px; border-radius: 8px; cursor: pointer; transition: 0.2s; margin-bottom: 8px; border: 1px solid transparent; background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .person-item:hover { background: #f8fafc; border-color: var(--primary); }
    .person-item.active { background: var(--primary); color: white; font-weight: bold; }
    
    /* Main Content */
    .main-content { display: flex; flex-direction: column; gap: 20px; }

    /* Pie Chart Hero */
    .hero-section { background: rgba(255,255,255,0.95); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; align-items: center; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
    .hero-section h2 { font-size: 1.2em; margin-bottom: 10px; color: var(--secondary); }
    .chart-container { height: 220px; width: 100%; max-width: 400px; }

    /* Dashboard Cards */
    .card-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; }
    .card { background: white; padding: 20px; border-radius: 15px; text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.05); border-bottom: 4px solid #eee; }
    .card .val { font-size: 1.5em; font-weight: 700; margin: 5px 0; }
    .card .label { font-size: 0.75em; color: #7f8c8d; text-transform: uppercase; letter-spacing: 1px; }
    .card.c1 { border-color: var(--danger); } 
    .card.c2 { border-color: var(--info); }   
    .card.c3 { border-color: var(--success); } 
    .card.c4 { border-color: var(--warning); } 

    .section { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
    .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .section h3 { font-size: 1.1em; color: var(--secondary); border-left: 4px solid var(--primary); padding-left: 10px; }
    
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; align-items: end; }
    
    label { display: block; margin-bottom: 5px; font-size: 0.85em; font-weight: 600; color: #666; }
    input, select, button { width: 100%; padding: 10px; border: 2px solid #e8ecf4; border-radius: 8px; outline: none; font-size: 0.9em; }
    
    button { background: var(--primary); color: white; font-weight: 600; cursor: pointer; border: none; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
    button:hover { opacity: 0.9; transform: translateY(-1px); box-shadow: 0 5px 10px rgba(0,0,0,0.1); }

    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; font-size: 0.85em; }
    th { background: #f8fafc; color: #7f8c8d; text-transform: uppercase; font-size: 0.75em; }
    .type-emi { color: var(--secondary); font-weight: 600; background: #f4f0fa; }
    
    .btn-group { display: flex; gap: 5px; }
    .btn-edit { background: var(--info); padding: 5px; font-size: 0.8em; }
    .btn-del { background: var(--danger); padding: 5px; font-size: 0.8em; }
    .btn-csv { background: #555; width: auto; padding: 8px 15px; }
    .btn-import { background: #27ae60; width: auto; padding: 8px 15px; }

    @media (max-width: 900px) { .container { grid-template-columns: 1fr; } .sidebar { order: 2; } .section-header { flex-direction: column; align-items: flex-start; gap: 10px; } .section-header button { width: 100%; } }
  </style>
</head>
<body>

<div class="container">
  <!-- Sidebar -->
  <div class="sidebar">
    <h2>Members</h2>
    <div id="personList"></div>
    <hr style="margin: 15px 0; border: 0; border-top: 1px solid #eee;">
    <input type="text" id="newPersonName" placeholder="New Member Name" style="margin-bottom: 8px;">
    <button onclick="addNewPerson()" style="background: var(--success);">Add Member</button>
  </div>

  <!-- Main Content -->
  <div class="main-content">
    
    <!-- Top Hero Section -->
    <div class="hero-section">
      <h2 id="heroTitle">Loan Breakdown</h2>
      <div class="chart-container">
        <canvas id="loanPieChart"></canvas>
      </div>
    </div>

    <!-- Dashboard -->
    <div class="card-row">
      <div class="card c1"><div class="label">Outstanding</div><div class="val" id="statBalance" style="color: var(--danger);">₹0</div></div>
      <div class="card c2"><div class="label">Amount Received</div><div class="val" id="statReceived" style="color: var(--info);">₹0</div></div>
      <div class="card c3"><div class="label">Amount  Sent</div><div class="val" id="statSent" style="color: var(--success);">₹0</div></div>
      <div class="card c4"><div class="label">Interest Accured</div><div class="val" id="statInterest" style="color: var(--warning);">₹0</div></div>
    </div>

    <!-- Rate Settings -->
    <div class="section">
      <h3>Loan Settings</h3>
      <div class="form-grid">
        <div style="flex: 2;">
          <label>Global Annual Interest Rate (%)</label>
          <input type="number" id="globalRate" step="0.01" placeholder="12.00">
        </div>
        <button onclick="updateSettings()" style="background: var(--secondary);">Update Rate</button>
      </div>
    </div>

    <!-- Entry Form & Import -->
    <div class="section">
      <div class="section-header">
        <h3 id="formTitle">Add Transaction</h3>
        <button onclick="document.getElementById('csvFileInput').click()" class="btn-import">Import CSV</button>
        <input type="file" id="csvFileInput" accept=".csv" style="display:none" onchange="handleCSVImport(event)">
      </div>
      <div class="form-grid">
        <div>
          <label>Type</label>
          <select id="tType">
            <option value="lent">I Lent Money (+)</option>
            <option value="received">I Received Money (-)</option>
          </select>
        </div>
        <div>
          <label>Amount (₹)</label>
          <input type="number" id="tAmount" placeholder="0.00">
        </div>
        <div>
          <label>Date</label>
          <input type="date" id="tDate">
        </div>
        <input type="hidden" id="editIdx" value="-1">
        <button onclick="handleTransaction()" id="submitBtn">Save Entry</button>
      </div>
    </div>

    <!-- History & Export -->
    <div class="section">
      <div class="section-header">
        <h3>Transaction History</h3>
        <button onclick="exportToCSV()" class="btn-csv">Export History (CSV)</button>
      </div>
      <div style="overflow-x: auto;">
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Type</th>
              <th>Amount</th>
              <th>Closing Balance</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="historyBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
  // --- FIREBASE CONFIG ---
  const firebaseConfig = {
    apiKey: "AIzaSyBkI0K87SReSf9QiCsxn1qwmxIFEgzNvd4",
    authDomain: "vaibhav-s-ledger.firebaseapp.com",
    databaseURL: "https://vaibhav-s-ledger-default-rtdb.firebaseio.com",
    projectId: "vaibhav-s-ledger",
    storageBucket: "vaibhav-s-ledger.firebasestorage.app",
    messagingSenderId: "199650798840",
    appId: "1:199650798840:web:06ff1415dd60a603f39f0d"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  let currentPersonId = null;
  let allPeople = {};
  let myPieChart = null;

  function init() {
    document.getElementById('tDate').valueAsDate = new Date();
    db.ref('ledger').on('value', snap => {
      allPeople = snap.val() || {};
      renderPersonList();
      if (!currentPersonId && Object.keys(allPeople).length > 0) {
        selectPerson(Object.keys(allPeople)[0]);
      } else if (currentPersonId) {
        updateUI();
      }
    });
  }

  function renderPersonList() {
    const list = document.getElementById('personList');
    list.innerHTML = '';
    Object.keys(allPeople).forEach(id => {
      const div = document.createElement('div');
      div.className = `person-item ${id === currentPersonId ? 'active' : ''}`;
      div.innerText = allPeople[id].name;
      div.onclick = () => selectPerson(id);
      list.appendChild(div);
    });
  }

  function selectPerson(id) {
    currentPersonId = id;
    document.getElementById('heroTitle').innerText = allPeople[id].name + "'s Breakdown";
    resetForm();
    renderPersonList();
    updateUI();
  }

  function addNewPerson() {
    const name = document.getElementById('newPersonName').value.trim();
    if (!name) return;
    db.ref('ledger').push({ name: name, globalRate: 0, transactions: [] });
    document.getElementById('newPersonName').value = '';
  }

  function updateSettings() {
    const rate = parseFloat(document.getElementById('globalRate').value);
    if (isNaN(rate)) return alert("Invalid Rate");
    db.ref(`ledger/${currentPersonId}/globalRate`).set(rate);
  }

  // --- CSV LOGIC ---
  function exportToCSV() {
    const person = allPeople[currentPersonId];
    if (!person || !person.transactions) return alert("No transactions to export");
    const userTrans = person.transactions.filter(t => t.type !== 'interest_emi');
    let csvContent = "data:text/csv;charset=utf-8,Date,Type,Amount\n";
    userTrans.forEach(t => { csvContent += `${t.date},${t.type},${t.amount}\n`; });
    const encodedUri = encodeURI(csvContent);
    const link = document.createElement("a");
    link.setAttribute("href", encodedUri);
    link.setAttribute("download", `${person.name}_ledger.csv`);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }

  function handleCSVImport(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
      const text = e.target.result;
      const lines = text.split('\n');
      const importedTrans = [];
      for (let i = 1; i < lines.length; i++) {
        const cols = lines[i].split(',');
        if (cols.length < 3) continue;
        const date = cols[0].trim();
        const type = cols[1].trim();
        const amount = parseFloat(cols[2]);
        if (date && (type === 'lent' || type === 'received') && !isNaN(amount)) {
          importedTrans.push({ id: 'T' + Date.now() + i, date, type, amount });
        }
      }
      if (importedTrans.length > 0) {
        if (confirm(`Import ${importedTrans.length} transactions? This will overwrite existing records.`)) {
          db.ref(`ledger/${currentPersonId}/transactions`).set(importedTrans);
        }
      } else { alert("No valid transactions found."); }
    };
    reader.readAsText(file);
    event.target.value = '';
  }

  // --- CALCULATION ENGINE ---
  function updateUI() {
    if (!currentPersonId || !allPeople[currentPersonId]) return;
    const person = allPeople[currentPersonId];
    document.getElementById('globalRate').value = person.globalRate || 0;
    
    let userTransactions = (person.transactions || []).filter(t => t.type !== 'interest_emi');
    userTransactions.sort((a,b) => new Date(a.date) - new Date(b.date));

    let processedTimeline = [];
    let runningBalance = 0;
    let accumulatedInterest = 0;
    let stats = { sent: 0, received: 0, interestPaid: 0 };
    const rate = person.globalRate || 0;

    if (userTransactions.length > 0) {
      let firstDate = new Date(userTransactions[0].date);
      let today = new Date();
      today.setHours(23, 59, 59);
      let currDate = new Date(firstDate);
      currDate.setHours(0,0,0,0);

      while (currDate <= today) {
        if (currDate.getDate() === 1 && accumulatedInterest > 0) {
          runningBalance += accumulatedInterest;
          stats.interestPaid += accumulatedInterest;
          processedTimeline.push({ date: currDate.toISOString().split('T')[0], type: 'interest_emi', amount: accumulatedInterest, balance: runningBalance });
          accumulatedInterest = 0;
        }
        let dayTransactions = userTransactions.filter(t => t.date === currDate.toISOString().split('T')[0]);
        dayTransactions.forEach(t => {
          if (t.type === 'lent') { runningBalance += t.amount; stats.sent += t.amount; }
          else { runningBalance -= t.amount; stats.received += t.amount; }
          processedTimeline.push({...t, balance: runningBalance});
        });
        if (runningBalance > 0 && rate > 0) accumulatedInterest += runningBalance * (rate / 100 / 365);
        currDate.setDate(currDate.getDate() + 1);
      }
    }

    document.getElementById('statBalance').innerText = '₹' + Math.round(runningBalance).toLocaleString();
    document.getElementById('statReceived').innerText = '₹' + Math.round(stats.received).toLocaleString();
    document.getElementById('statSent').innerText = '₹' + Math.round(stats.sent).toLocaleString();
    document.getElementById('statInterest').innerText = '₹' + Math.round(stats.interestPaid).toLocaleString();
    
    updatePieChart(stats.sent, stats.interestPaid, stats.received);

    const tbody = document.getElementById('historyBody');
    tbody.innerHTML = '';
    processedTimeline.reverse().forEach((t) => {
      const row = tbody.insertRow();
      if(t.type === 'interest_emi') row.className = 'type-emi';
      row.innerHTML = `
        <td>${t.date}</td>
        <td>${t.type === 'lent' ? '➕ Principal Sent' : t.type === 'received' ? '➖ Repayment' : '💰 EMI on Interest'}</td>
        <td>₹${Math.round(t.amount).toLocaleString()}</td>
        <td>₹${Math.round(t.balance).toLocaleString()}</td>
        <td>${t.type !== 'interest_emi' ? `
          <div class="btn-group">
            <button class="btn-edit" onclick="editEntry('${t.id}')">Edit</button>
            <button class="btn-del" onclick="deleteEntry('${t.id}')">Del</button>
          </div>` : '-'}</td>`;
    });
  }

  function updatePieChart(sent, interest, received) {
    const ctx = document.getElementById('loanPieChart').getContext('2d');
    if (myPieChart) myPieChart.destroy();
    myPieChart = new Chart(ctx, {
      type: 'doughnut',
      data: {
        labels: ['Principal Sent', 'Interest EMI', 'Repayments'],
        datasets: [{
          data: [sent, interest, received],
          backgroundColor: ['#00d4aa', '#f1c40f', '#3498db'],
          borderWidth: 2, borderColor: '#ffffff'
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 10 } } } },
        cutout: '65%'
      }
    });
  }

  function handleTransaction() {
    const type = document.getElementById('tType').value;
    const amount = parseFloat(document.getElementById('tAmount').value);
    const date = document.getElementById('tDate').value;
    const editId = document.getElementById('editIdx').value;
    if (!amount || !date) return alert("Fill all fields");
    let person = allPeople[currentPersonId];
    if (!person.transactions) person.transactions = [];
    if (editId === "-1") {
      person.transactions.push({ id: 'T' + Date.now(), type, amount, date });
    } else {
      const idx = person.transactions.findIndex(t => t.id === editId);
      person.transactions[idx] = { ...person.transactions[idx], type, amount, date };
    }
    db.ref(`ledger/${currentPersonId}/transactions`).set(person.transactions);
    resetForm();
  }

  function editEntry(id) {
    const entry = allPeople[currentPersonId].transactions.find(t => t.id === id);
    document.getElementById('tType').value = entry.type;
    document.getElementById('tAmount').value = entry.amount;
    document.getElementById('tDate').value = entry.date;
    document.getElementById('editIdx').value = id;
    document.getElementById('submitBtn').innerText = "Update Entry";
    document.getElementById('formTitle').innerText = "Edit Transaction";
  }

  function deleteEntry(id) {
    if (!confirm("Delete entry?")) return;
    const newTrans = allPeople[currentPersonId].transactions.filter(t => t.id !== id);
    db.ref(`ledger/${currentPersonId}/transactions`).set(newTrans);
  }

  function resetForm() {
    document.getElementById('tAmount').value = '';
    document.getElementById('editIdx').value = '-1';
    document.getElementById('submitBtn').innerText = "Save Entry";
    document.getElementById('formTitle').innerText = "Add Transaction";
    document.getElementById('tDate').valueAsDate = new Date();
  }

  init();
</script>
</body>
</html>
