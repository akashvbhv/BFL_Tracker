<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💰 Friend Loan Tracker Pro</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
            min-height: 100vh; padding: 20px; 
        }
        .container { 
            max-width: 900px; margin: 0 auto; 
            background: white; border-radius: 24px; 
            box-shadow: 0 25px 50px rgba(0,0,0,0.15); overflow: hidden; 
        }
        .header { 
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); 
            color: white; padding: 35px; text-align: center; 
        }
        .header h1 { font-size: 2.4em; margin-bottom: 10px; }
        .stats { 
            display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); 
            gap: 20px; margin-top: 25px; 
        }
        .stat { 
            background: rgba(255,255,255,0.25); padding: 25px; 
            border-radius: 16px; text-align: center; 
        }
        .stat-value { font-size: 2.8em; font-weight: bold; margin-bottom: 8px; }
        .main { padding: 35px; }
        .setup { 
            background: #f8f9ff; padding: 30px; border-radius: 20px; 
            margin-bottom: 35px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
            gap: 20px; 
        }
        input, button, select { 
            padding: 16px; border: none; border-radius: 12px; font-size: 16px; 
            font-family: inherit; 
        }
        input { 
            background: white; border: 2px solid #e1e5e9; width: 100%; 
        }
        input:focus { 
            outline: none; border-color: #4facfe; 
            box-shadow: 0 0 0 4px rgba(79,172,254,0.1); 
        }
        .btn { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
            color: white; cursor: pointer; font-weight: 600; 
            transition: all 0.3s; border: none; 
        }
        .btn:hover { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(102,126,234,0.4); }
        .btn-success { background: linear-gradient(135deg, #10b981 0%, #059669 100%); }
        .btn-danger { background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); }
        .btn-warning { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); }
        .transaction-form { 
            display: grid; grid-template-columns: 2fr 1.5fr 1.5fr 2fr 1fr auto; 
            gap: 20px; margin-bottom: 35px; align-items: end; 
        }
        @media (max-width: 768px) { 
            .transaction-form { grid-template-columns: 1fr; } 
            .setup { grid-template-columns: 1fr; }
        }
        .transactions { 
            max-height: 450px; overflow-y: auto; border: 1px solid #eee; 
            border-radius: 16px; margin-bottom: 30px; 
        }
        .transaction { 
            display: grid; grid-template-columns: 1.5fr 1fr 1fr 1fr 2fr auto; 
            gap: 15px; padding: 25px; border-bottom: 1px solid #f3f4f6; 
            align-items: center; background: white; 
            transition: background 0.2s; 
        }
        .transaction:hover { background: #f8fafc; }
        .transaction:last-child { border-bottom: none; }
        @media (max-width: 768px) { 
            .transaction { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 12px; } 
        }
        .positive { color: #10b981; font-weight: 700; font-size: 1.1em; }
        .negative { color: #ef4444; font-weight: 700; font-size: 1.1em; }
        .chart-container { 
            height: 350px; margin: 35px 0; 
            background: linear-gradient(135deg, #f8f9ff 0%, #e8f0fe 100%); 
            border-radius: 20px; padding: 30px; 
        }
        .action-buttons { 
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
            gap: 20px; margin-top: 30px; 
        }
        .notification { 
            position: fixed; top: 20px; right: 20px; 
            background: #10b981; color: white; padding: 20px 30px; 
            border-radius: 12px; box-shadow: 0 10px 30px rgba(16,185,129,0.4); 
            transform: translateX(400px); transition: transform 0.3s; 
            z-index: 1000; 
        }
        .notification.show { transform: translateX(0); }
        .auto-interest { background: #fef3c7 !important; border-left: 4px solid #f59e0b; }
        .file-input { display: none; }
        label.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 id="appTitle">💰 Friend Loan Tracker Pro</h1>
            <p>Daily compounding • Auto monthly interest • CSV Import/Export</p>
            <div class="stats">
                <div class="stat">
                    <div class="stat-value" id="currentBalance">₹0</div>
                    <div>Outstanding Balance</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="totalLent">₹0</div>
                    <div>Total Lent</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="totalRepaid">₹0</div>
                    <div>Total Repaid</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="totalInterest">₹0</div>
                    <div>Total Interest</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="lastInterestDate">-</div>
                    <div>Last Interest Date</div>
                </div>
            </div>
        </div>
        
        <div class="main">
            <div class="setup">
                <div>
                    <label>Friend's Name</label>
                    <input type="text" id="friendName" placeholder="Enter friend's name" value="Friend">
                </div>
                <div>
                    <label>Annual Interest Rate (%)</label>
                    <input type="number" id="annualRate" placeholder="12" value="12" step="0.1" min="0" max="100">
                </div>
                <div>
                    <label>Loan Start Date</label>
                    <input type="date" id="startDate">
                </div>
                <div style="grid-column: span 2;">
                    <button class="btn" onclick="saveSettings()" style="width: 100%;">💾 Save Settings</button>
                </div>
            </div>

            <div class="transaction-form">
                <input type="date" id="transDate">
                <input type="number" id="transAmount" placeholder="₹ Amount" step="0.01">
                <select id="transType">
                    <option value="loan">💰 Loan Disbursed</option>
                    <option value="repayment">💸 Repayment Received</option>
                    <option value="interest">📈 Interest (Manual)</option>
                </select>
                <input type="text" id="transComment" placeholder="Comments / Reference">
                <button class="btn btn-success" onclick="addTransaction()">➕ Add</button>
            </div>

            <div class="chart-container">
                <canvas id="balanceChart"></canvas>
            </div>

            <div class="transactions" id="transactionsList">
                <div style="padding: 40px; text-align: center; color: #6b7280;">
                    ✨ No transactions yet. Add your first loan to get started!
                </div>
            </div>

            <div class="action-buttons">
                <label for="csvImport" class="btn">
                    📥 Import CSV <input type="file" id="csvImport" class="file-input" accept=".csv" onchange="importCSV(event)">
                </label>
                <button class="btn" onclick="exportToCSV()">📤 Export CSV</button>
                <button class="btn btn-warning" onclick="checkAutoInterest()">🔄 Check Monthly Interest</button>
                <button class="btn btn-danger" onclick="clearAllData()">🗑️ Clear All Data</button>
            </div>
        </div>
    </div>

    <div id="notification" class="notification"></div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        let appData = {
            settings: { friendName: 'Friend', annualRate: 12, startDate: '', lastInterestCheck: '' },
            transactions: [],
            chart: null
        };

        // Initialize app
        document.addEventListener('DOMContentLoaded', async function() {
            await loadData();
            updateDateInputs();
            checkAutoInterest(true);
            renderTransactions();
            renderChart();
            updateStats();
            document.getElementById('appTitle').textContent = `${appData.settings.friendName}'s Loan Tracker Pro 💰`;
        });

        // Auto monthly interest calculation
        async function checkAutoInterest(init = false) {
            const today = new Date();
            const isFirstOfMonth = today.getDate() === 1;
            
            if (!isFirstOfMonth && !init) {
                showNotification('🗓️ Not 1st of month. Auto-interest only runs monthly.', 'info');
                return;
            }

            const lastCheck = appData.settings.lastInterestCheck;
            const lastCheckDate = lastCheck ? new Date(lastCheck) : new Date(0);
            
            // If already checked this month, skip
            if (lastCheckDate.getMonth() === today.getMonth() && lastCheckDate.getFullYear() === today.getFullYear()) {
                if (!init) showNotification('✅ Interest already processed this month', 'success');
                return;
            }

            // Find last transaction
            if (appData.transactions.length === 0) {
                showNotification('📝 Add transactions first before auto-interest', 'info');
                return;
            }

            const sortedTransactions = [...appData.transactions].sort((a, b) => new Date(a.date) - new Date(b.date));
            const lastTrans = sortedTransactions[sortedTransactions.length - 1];
            const daysElapsed = Math.floor((today - new Date(lastTrans.date)) / (1000 * 60 * 60 * 24));
            
            if (daysElapsed <= 0) return;

            const dailyRate = (appData.settings.annualRate / 100) / 365;
            const lastBalance = lastTrans.balance || 0;
            const interest = lastBalance * (Math.pow(1 + dailyRate, daysElapsed) - 1);
            
            if (interest > 0.01) { // Only if meaningful interest
                appData.transactions.push({
                    id: `auto_${Date.now()}`,
                    date: today.toISOString().split('T')[0],
                    amount: Math.round(interest * 100) / 100,
                    type: 'interest',
                    comment: `Auto: ${daysElapsed} days @ ${(dailyRate*100).toFixed(4)}% daily`,
                    balance: lastBalance + interest,
                    auto: true
                });
                
                appData.settings.lastInterestCheck = today.toISOString().split('T')[0];
                await saveData();
                renderTransactions();
                renderChart();
                updateStats();
                
                showNotification(`✅ Auto-added ₹${interest.toFixed(2)} interest (${daysElapsed} days)`, 'success');
            }
        }

        function addTransaction() {
            const date = document.getElementById('transDate').value;
            const amount = parseFloat(document.getElementById('transAmount').value);
            const type = document.getElementById('transType').value;
            const comment = document.getElementById('transComment').value;

            if (!date || isNaN(amount) || amount === 0) {
                showNotification('❌ Please fill date and valid amount', 'error');
                return;
            }

            // Calculate new balance
            const sortedTransactions = [...appData.transactions].sort((a, b) => new Date(a.date) - new Date(b.date));
            const lastBalance = sortedTransactions.length > 0 ? sortedTransactions[sortedTransactions.length - 1].balance || 0 : 0;
            const newAmount = type === 'repayment' ? -amount : amount;
            const newBalance = lastBalance + newAmount;

            appData.transactions.push({
                id: Date.now().toString(),
                date: date,
                amount: newAmount,
                type: type,
                comment: comment || '',
                balance: newBalance
            });

            // Clear form
            document.getElementById('transAmount').value = '';
            document.getElementById('transComment').value = '';
            
            saveData();
            renderTransactions();
            renderChart();
            updateStats();
            showNotification('✅ Transaction added!', 'success');
        }

        function renderTransactions() {
            const container = document.getElementById('transactionsList');
            let balance = 0;
            let html = '';

            const sortedTransactions = [...appData.transactions].sort((a, b) => new Date(a.date) - new Date(b.date));

            sortedTransactions.forEach((trans, index) => {
                balance = trans.balance || balance + trans.amount;
                const date = new Date(trans.date).toLocaleDateString('en-IN', { 
                    day: '2-digit', month: 'short', year: 'numeric' 
                });
                const amountClass = trans.amount >= 0 ? 'positive' : 'negative';
                const amountDisplay = Math.abs(trans.amount).toLocaleString('en-IN', { 
                    maximumFractionDigits: 0 
                });
                const balanceDisplay = balance.toLocaleString('en-IN', { maximumFractionDigits: 0 });
                const autoBadge = trans.auto ? '<span style="background:#fef3c7;color:#92400e;padding:2px 8px;border-radius:12px;font-size:0.8em;">Auto</span>' : '';

                html += `
                    <div class="transaction ${trans.auto ? 'auto-interest' : ''}">
                        <div><strong>${date}</strong> ${autoBadge}</div>
                        <div class="${amountClass}">₹${amountDisplay}</div>
                        <div style="text-transform: capitalize;">${trans.type.replace('_', ' ')}</div>
                        <div>₹${balanceDisplay}</div>
                        <div style="font-size: 0.9em; color: #6b7280;">${trans.comment}</div>
                        <button class="btn" style="padding:8px 12px;font-size:14px;" onclick="deleteTransaction('${trans.id}')">🗑️</button>
                    </div>
                `;
            });

            container.innerHTML = html || '<div style="padding:40px;text-align:center;color:#6b7280;">✨ No transactions yet. Add your first loan!</div>';
        }

        function updateStats() {
            let balance = 0, totalLent = 0, totalRepaid = 0, totalInterest = 0;
            
            appData.transactions.forEach(trans => {
                if (trans.type === 'loan') totalLent += trans.amount;
                if (trans.type === 'repayment') totalRepaid += Math.abs(trans.amount);
                if (trans.type === 'interest') totalInterest += trans.amount;
                if (trans.balance) balance = trans.balance;
            });

            document.getElementById('currentBalance').textContent = `₹${balance.toLocaleString('en-IN', {maximumFractionDigits: 0})}`;
            document.getElementById('currentBalance').parentElement.style.color = balance >= 0 ? '#10b981' : '#ef4444';
            document.getElementById('totalLent').textContent = `₹${totalLent.toLocaleString('en-IN', {maximumFractionDigits: 0})}`;
            document.getElementById('totalRepaid').textContent = `₹${totalRepaid.toLocaleString('en-IN', {maximumFractionDigits: 0})}`;
            document.getElementById('totalInterest').textContent = `₹${totalInterest.toLocaleString('en-IN', {maximumFractionDigits: 0})}`;
            document.getElementById('lastInterestDate').textContent = appData.settings.lastInterestCheck || '-';
        }

        function renderChart() {
            const ctx = document.getElementById('balanceChart').getContext('2d');
            const sortedTransactions = [...appData.transactions].sort((a, b) => new Date(a.date) - new Date(b.date));
            
            const labels = sortedTransactions.map(t => new Date(t.date).toLocaleDateString('en-IN', {month: 'short', day: 'numeric'}));
            const data = sortedTransactions.map(t => t.balance || 0);

            if (appData.chart) appData.chart.destroy();
            
            appData.chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Outstanding Balance',
                        data: data,
                        borderColor: '#4facfe',
                        backgroundColor: 'rgba(79, 172, 254, 0.1)',
                        tension: 0.4,
                        fill: true,
                        pointRadius: 8,
                        pointHoverRadius: 10,
                        borderWidth: 3
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: { callback: value => '₹' + value.toLocaleString('en-IN') }
                        }
                    },
                    plugins: { legend: { display: false } }
                }
            });
        }

        // CSV Import/Export
        function importCSV(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const text = e.target.result;
                const rows = text.split('\n').map(row => row.split(',').map(cell => cell.trim().replace(/"/g, '')));
                
                // Skip header
                const newTransactions = [];
                for (let i = 1; i < rows.length; i++) {
                    if (rows[i].length >= 4) {
                        const date = rows[i][0];
                        const amount = parseFloat(rows[i][1]);
                        const type = rows[i][2].toLowerCase();
                        const comment = rows[i][3];
                        
                        if (!isNaN(amount) && date && type) {
                            newTransactions.push({
                                id: `import_${Date.now()}_${i}`,
                                date: date.split('-')[2] + '-' + date.split('-')[1] + '-' + date.split('-')[0], // Handle DD-MM-YYYY
                                amount: type === 'repayment' ? -amount : amount,
                                type: type,
                                comment: comment,
                                balance: 0 // Will be recalculated
                            });
                        }
                    }
                }

                if (newTransactions.length > 0) {
                    appData.transactions = [...appData.transactions, ...newTransactions];
                    saveData();
                    renderTransactions();
                    renderChart();
                    updateStats();
                    showNotification(`✅ Imported ${newTransactions.length} transactions!`, 'success');
                    event.target.value = '';
                }
            };
            reader.readAsText(file);
        }

        function exportToCSV() {
            let csv = 'Date,Amount,Type,Comments\n';
            const sortedTransactions = [...appData.transactions].sort((a, b) => new Date(a.date) - new Date(b.date));
            
            sortedTransactions.forEach(trans => {
                const date = new Date(trans.date).toLocaleDateString('en-IN');
                csv += `"${date}",${trans.amount},"${trans.type}","${trans.comment}"\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `loan-tracker-${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
            URL.revokeObjectURL(url);
            showNotification('📤 CSV exported successfully!', 'success');
        }

        // Utilities
        function updateDateInputs() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('transDate').value = today;
            if (!appData.settings.startDate) {
                appData.settings.startDate = new Date(Date.now() - 30*24*60*60*1000).toISOString().split('T')[0];
            }
            document.getElementById('startDate').value = appData.settings.startDate;
        }

        function saveSettings() {
            appData.settings.friendName = document.getElementById('friendName').value;
            appData.settings.annualRate = parseFloat(document.getElementById('annualRate').value);
            appData.settings.startDate = document.getElementById('startDate').value;
            localStorage.setItem('loanTrackerSettings', JSON.stringify(appData.settings));
            showNotification('⚙️ Settings saved!', 'success');
        }

        function deleteTransaction(id) {
            appData.transactions = appData.transactions.filter(t => t.id !== id);
            saveData();
            renderTransactions();
            renderChart();
            updateStats();
            showNotification('🗑️ Transaction deleted', 'info');
        }

        function clearAllData() {
            if (confirm('⚠️ Delete ALL data? This cannot be undone!\n(Export CSV first if needed)')) {
                appData.transactions = [];
                localStorage.removeItem('loanTracker');
                renderTransactions();
                renderChart();
                updateStats();
                showNotification('🗑️ All data cleared', 'warning');
            }
        }

        function showNotification(message, type = 'info') {
            const notif = document.getElementById('notification');
            notif.textContent = message;
            notif.className = `notification show ${type}`;
            setTimeout(() => {
                notif.classList.remove('show');
            }, 4000);
        }

        // Storage
        async function saveData() {
            localStorage.setItem('loanTracker', JSON.stringify(appData));
        }

        async function loadData() {
            const saved = localStorage.getItem('loanTracker');
            const settings = localStorage.getItem('loanTrackerSettings');
            
            if (saved) appData = JSON.parse(saved);
            if (settings) appData.settings = JSON.parse(settings);
            
            // Ensure balances are calculated
            let runningBalance = 0;
            const sortedTransactions = [...appData.transactions].sort((a, b) => new Date(a.date) - new Date(b.date));
            sortedTransactions.forEach((trans, index) => {
                runningBalance += trans.amount;
                trans.balance = runningBalance;
            });
        }
    </script>
</body>
</html>
