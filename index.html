<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family Loan Tracker - INR</title>
  
  <!-- Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <!-- Firebase SDKs (Compat Version for better HTML integration) -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh; padding: 20px;
    }
    .container { max-width: 1200px; margin: 0 auto; }
    h1 { text-align: center; color: white; margin: 20px 0; font-weight: 300; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
    
    .pie-chart-hero { 
      background: rgba(255,255,255,0.95); border-radius: 20px; padding: 30px; 
      margin: 20px auto 30px auto; box-shadow: 0 15px 40px rgba(0,0,0,0.2); 
      text-align: center; max-width: 500px;
    }
    .pie-chart-hero canvas { max-height: 250px; margin: 0 auto; }
    
    .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-bottom: 30px; }
    .card { 
      background: rgba(255,255,255,0.95); border-radius: 15px; padding: 20px; text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15); transition: transform 0.3s ease;
    }
    .card:hover { transform: translateY(-5px); }
    .card .value { font-size: 1.8em; font-weight: 700; margin: 10px 0; }
    .card.outstanding { border-top: 5px solid #00d4aa; color: #00d4aa; }
    .card.interest { border-top: 5px solid #ff6b9d; color: #ff6b9d; }
    .card.repayments { border-top: 5px solid #4dabf7; color: #4dabf7; }
    .card.total-lent { border-top: 5px solid #ffd93d; color: #f39c12; }
    .card h3 { color: #2c3e50; font-size: 1em; }
    .card .label { color: #7f8c8d; font-size: 0.85em; }

    .section { background: rgba(255,255,255,0.95); border-radius: 15px; padding: 25px; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
    .section h2 { color: #2c3e50; margin-bottom: 20px; border-left: 5px solid #667eea; padding-left: 15px; font-size: 1.2em; }
    
    .form-row { display: flex; flex-wrap: wrap; gap: 15px; align-items: flex-end; margin-bottom: 15px; }
    .form-group { flex: 1; min-width: 200px; }
    label { display: block; margin-bottom: 5px; font-size: 0.9em; font-weight: 600; color: #34495e; }
    input, select, textarea { width: 100%; padding: 10px; border: 2px solid #e8ecf4; border-radius: 8px; font-size: 14px; }
    
    button { 
      background: linear-gradient(45deg, #667eea, #764ba2); color: white; border: none;
      padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; transition: 0.3s;
    }
    button:hover { opacity: 0.9; transform: translateY(-2px); }
    .btn-success { background: #00d4aa; }
    .btn-danger { background: #ff6b9d; }
    .btn-warning { background: #ffd93d; color: #2c3e50; }
    .btn-info { background: #4dabf7; }

    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; font-size: 14px; }
    th { background: #f8fafc; color: #2c3e50; }
    .history { max-height: 400px; overflow-y: auto; }
    
    @media (max-width: 768px) { .form-row { flex-direction: column; } .form-group { width: 100%; } }
  </style>
</head>
<body>

<div class="container">
  <h1>Family Loan Tracker</h1>

  <div class="pie-chart-hero">
    <canvas id="pieChart"></canvas>
  </div>

  <div class="dashboard">
    <div class="card outstanding">
      <h3>Current Balance</h3>
      <div class="value" id="currentPrincipal">₹0</div>
      <div class="label">Amount still due</div>
    </div>
    <div class="card interest">
      <h3>Interest Added</h3>
      <div class="value" id="totalInterest">₹0</div>
      <div class="label">Total interest accumulated</div>
    </div>
    <div class="card repayments">
      <h3>Amount Returned</h3>
      <div class="value" id="totalRepayments">₹0</div>
      <div class="label">Payments received</div>
    </div>
    <div class="card total-lent">
      <h3>Total Money Sent</h3>
      <div class="value" id="totalLentAmount">₹0</div>
      <div class="label">Total principal lent</div>
    </div>
  </div>

  <div class="section">
    <h2>Loan Setup</h2>
    <div class="form-row">
      <div class="form-group">
        <label>To Whom</label>
        <input type="text" id="loanName" placeholder="e.g. Ravi">
      </div>
      <div class="form-group">
        <label>Annual Interest Rate (%)</label>
        <input type="number" id="rate" placeholder="8.5" step="0.1">
      </div>
      <button onclick="setupLoan()">Update Loan Info</button>
    </div>
  </div>

  <div class="section">
    <h2>Add Transaction</h2>
    <div class="form-row">
      <div class="form-group">
        <label>Type</label>
        <select id="type">
          <option value="redisbursal">I Lent Money (+)</option>
          <option value="repayment">I Received Money (-)</option>
        </select>
      </div>
      <div class="form-group">
        <label>Amount (₹)</label>
        <input type="number" id="amount" placeholder="5000">
      </div>
      <div class="form-group">
        <label>Date</label>
        <input type="date" id="transDate">
      </div>
      <div class="form-group">
        <label>Notes</label>
        <input type="text" id="comment" placeholder="Lunch, EMI, etc.">
      </div>
      <button id="transactionBtn" onclick="addTransaction()">Add Entry</button>
    </div>
  </div>

  <div class="section">
    <h2>Transaction Record</h2>
    <div class="form-row" style="margin-bottom: 20px;">
      <button onclick="toggleMonthlyView()" id="monthlyToggle">Switch to Detailed View</button>
      <button onclick="exportData()" class="btn-info">Backup JSON</button>
      <button onclick="clearData()" class="btn-danger">Reset All</button>
    </div>
    <div class="history">
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Type</th>
            <th>Amount</th>
            <th>Interest</th>
            <th>Balance</th>
            <th>Notes</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="historyBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
  // --- FIREBASE CONFIGURATION ---
  const firebaseConfig = {
    apiKey: "AIzaSyBkI0K87SReSf9QiCsxn1qwmxIFEgzNvd4",
    authDomain: "vaibhav-s-ledger.firebaseapp.com",
    databaseURL: "https://vaibhav-s-ledger-default-rtdb.firebaseio.com",
    projectId: "vaibhav-s-ledger",
    storageBucket: "vaibhav-s-ledger.firebasestorage.app",
    messagingSenderId: "199650798840",
    appId: "1:199650798840:web:06ff1415dd60a603f39f0d",
    measurementId: "G-LYEZTLM2Y6"
  };

  // Initialize Firebase
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  // Get loan ID from URL or use 'default'
  const urlParams = new URLSearchParams(window.location.search);
  const loanId = urlParams.get('loan') || 'default';
  const loanRef = db.ref('loans/' + loanId);

  // Global State
  let loan = {
    name: '',
    principal: 0,
    originalPrincipal: 0,
    totalLent: 0,
    rate: 0,
    startDate: new Date().toISOString(),
    lastUpdate: new Date().toISOString(),
    history: [],
    totalInterest: 0,
    totalRepayments: 0,
    dailyInterest: {}
  };

  let showDetailedView = false;
  let pieChart = null;

  // --- LOGIC FUNCTIONS ---

  function formatINR(amount) {
    return new Intl.NumberFormat('en-IN', {
      style: 'currency', currency: 'INR',
      minimumFractionDigits: 0, maximumFractionDigits: 0
    }).format(amount);
  }

  function setupLoan() {
    const name = document.getElementById('loanName').value.trim();
    const rateVal = parseFloat(document.getElementById('rate').value);
    
    if (!name || isNaN(rateVal)) return alert("Please enter name and rate");
    
    loan.name = name;
    loan.rate = rateVal;
    saveLoan();
  }

  function calcInterest(targetDate = new Date()) {
    const to = new Date(targetDate);
    let from = new Date(loan.lastUpdate);
    from.setHours(0,0,0,0);
    to.setHours(0,0,0,0);

    if (to <= from) return;

    const dailyRate = (loan.rate / 100) / 365;
    let runningDate = new Date(from.getTime());

    while (runningDate < to) {
      const dayKey = runningDate.toISOString().slice(0, 10);
      if (loan.principal > 0 && loan.rate > 0) {
        const interestForDay = loan.principal * dailyRate;
        loan.principal += interestForDay;
        loan.totalInterest += interestForDay;
        if(!loan.dailyInterest) loan.dailyInterest = {};
        loan.dailyInterest[dayKey] = (loan.dailyInterest[dayKey] || 0) + interestForDay;
      }
      runningDate.setDate(runningDate.getDate() + 1);
    }
    loan.lastUpdate = to.toISOString();
  }

  function addTransaction() {
    const type = document.getElementById('type').value;
    const amountVal = parseFloat(document.getElementById('amount').value);
    const dateInput = document.getElementById('transDate').value;
    const comment = document.getElementById('comment').value;
    const transDate = dateInput ? new Date(dateInput) : new Date();

    if (isNaN(amountVal) || amountVal <= 0) return alert("Enter valid amount");

    calcInterest(transDate);

    if(!loan.history) loan.history = [];

    if (type === 'redisbursal') {
      loan.principal += amountVal;
      loan.totalLent += amountVal;
    } else {
      loan.principal -= amountVal;
      loan.totalRepayments += amountVal;
    }

    loan.history.push({
      date: transDate.toISOString(),
      type: type,
      amount: amountVal,
      interest: 0,
      balance: loan.principal,
      comment: comment
    });

    saveLoan();
    document.getElementById('amount').value = '';
    document.getElementById('comment').value = '';
  }

  function deleteTransaction(index) {
    if(!confirm("Delete this entry?")) return;
    loan.history.splice(index, 1);
    recalculateEverything();
    saveLoan();
  }

  function recalculateEverything() {
    // Reset totals and rerun history
    const oldHistory = [...(loan.history || [])];
    const oldName = loan.name;
    const oldRate = loan.rate;
    
    loan = {
      name: oldName,
      rate: oldRate,
      principal: 0,
      totalLent: 0,
      totalInterest: 0,
      totalRepayments: 0,
      lastUpdate: oldHistory.length > 0 ? oldHistory[0].date : new Date().toISOString(),
      history: [],
      dailyInterest: {}
    };

    oldHistory.sort((a,b) => new Date(a.date) - new Date(b.date)).forEach(entry => {
      calcInterest(new Date(entry.date));
      if (entry.type === 'redisbursal') {
        loan.principal += entry.amount;
        loan.totalLent += entry.amount;
      } else {
        loan.principal -= entry.amount;
        loan.totalRepayments += entry.amount;
      }
      loan.history.push({...entry, balance: loan.principal});
      loan.lastUpdate = entry.date;
    });
    calcInterest(new Date());
  }

  function saveLoan() {
    loanRef.set(loan);
  }

  function loadLoan() {
    loanRef.on('value', (snap) => {
      if (snap.exists()) {
        const data = snap.val();
        loan = data;
        if (!loan.history) loan.history = [];
        if (!loan.dailyInterest) loan.dailyInterest = {};
        updateDisplay();
      }
    });
  }

  function updateDisplay() {
    document.getElementById('currentPrincipal').textContent = formatINR(loan.principal);
    document.getElementById('totalInterest').textContent = formatINR(loan.totalInterest);
    document.getElementById('totalRepayments').textContent = formatINR(loan.totalRepayments);
    document.getElementById('totalLentAmount').textContent = formatINR(loan.totalLent);
    document.getElementById('loanName').value = loan.name || '';
    document.getElementById('rate').value = loan.rate || '';

    updatePieChart();
    updateHistoryTable();
  }

  function updatePieChart() {
    const ctx = document.getElementById('pieChart').getContext('2d');
    if (pieChart) pieChart.destroy();
    pieChart = new Chart(ctx, {
      type: 'doughnut',
      data: {
        labels: ['Sent', 'Interest', 'Returned'],
        datasets: [{
          data: [loan.totalLent, loan.totalInterest, loan.totalRepayments],
          backgroundColor: ['#00d4aa', '#ff6b9d', '#4dabf7']
        }]
      },
      options: { plugins: { legend: { position: 'bottom' } } }
    });
  }

  function updateHistoryTable() {
    const tbody = document.getElementById('historyBody');
    tbody.innerHTML = '';
    
    // Sort history by date descending for display
    const displayData = [...loan.history].reverse();

    displayData.forEach((entry, revIndex) => {
      const actualIndex = loan.history.length - 1 - revIndex;
      const row = tbody.insertRow();
      row.innerHTML = `
        <td>${new Date(entry.date).toLocaleDateString('en-IN')}</td>
        <td>${entry.type === 'redisbursal' ? '➕ Lent' : '➖ Received'}</td>
        <td>${formatINR(entry.amount)}</td>
        <td>-</td>
        <td style="font-weight:bold">${formatINR(entry.balance)}</td>
        <td>${entry.comment || '-'}</td>
        <td><button class="btn-danger" onclick="deleteTransaction(${actualIndex})">🗑️</button></td>
      `;
    });
  }

  function toggleMonthlyView() {
    showDetailedView = !showDetailedView;
    document.getElementById('monthlyToggle').textContent = showDetailedView ? "Switch to Monthly View" : "Switch to Detailed View";
    updateDisplay();
  }

  function exportData() {
    const dataStr = JSON.stringify(loan, null, 2);
    const blob = new Blob([dataStr], {type: 'application/json'});
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = `loan-tracker-${loan.name || 'backup'}.json`;
    link.click();
  }

  function clearData() {
    if(confirm("Danger! This will delete all records for this loan. Continue?")) {
      loanRef.remove();
      window.location.reload();
    }
  }

  // Init
  loadLoan();
</script>

</body>
</html>
