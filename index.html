<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family Ledger - Multi-User OD</title>
  
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>

  <style>
    :root { --primary: #667eea; --secondary: #764ba2; --success: #00d4aa; --danger: #ff6b9d; }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
    body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; color: #2c3e50; }
    .container { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 280px 1fr; gap: 20px; }
    
    /* Sidebar */
    .sidebar { background: rgba(255,255,255,0.95); border-radius: 15px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); height: fit-content; }
    .sidebar h2 { font-size: 1.2em; margin-bottom: 15px; color: var(--secondary); border-bottom: 2px solid #eee; padding-bottom: 5px; }
    .person-item { padding: 10px; border-radius: 8px; cursor: pointer; transition: 0.2s; margin-bottom: 5px; border: 1px solid transparent; }
    .person-item:hover { background: #f0f4f8; }
    .person-item.active { background: var(--primary); color: white; font-weight: bold; }
    
    /* Main Content */
    .main-content { display: flex; flex-direction: column; gap: 20px; }
    .card-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
    .card { background: white; padding: 20px; border-radius: 15px; text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
    .card .val { font-size: 1.6em; font-weight: 700; margin: 5px 0; color: var(--secondary); }
    .card .label { font-size: 0.8em; color: #7f8c8d; text-transform: uppercase; }

    .section { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; align-items: end; }
    
    input, select, button { width: 100%; padding: 12px; border: 2px solid #e8ecf4; border-radius: 8px; outline: none; }
    button { background: var(--primary); color: white; font-weight: 600; cursor: pointer; border: none; transition: 0.3s; }
    button:hover { opacity: 0.9; transform: translateY(-2px); }
    .btn-edit { background: #f39c12; padding: 5px 10px; font-size: 0.8em; }
    .btn-del { background: var(--danger); padding: 5px 10px; font-size: 0.8em; }

    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; font-size: 0.9em; }
    th { background: #f8fafc; color: #666; }
    .type-interest { color: #9b59b6; font-style: italic; }
    
    @media (max-width: 900px) { .container { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

<div class="container">
  <!-- Person Management -->
  <div class="sidebar">
    <h2>People</h2>
    <div id="personList"></div>
    <hr style="margin: 15px 0; border: 0; border-top: 1px solid #eee;">
    <input type="text" id="newPersonName" placeholder="Add New Name" style="margin-bottom: 10px;">
    <button onclick="addNewPerson()" class="btn-success">Add Person</button>
  </div>

  <div class="main-content">
    <div class="card-row">
      <div class="card">
        <div class="label">Outstanding Balance</div>
        <div class="val" id="statBalance">₹0</div>
      </div>
      <div class="card">
        <div class="label">Rate (Annual)</div>
        <div class="val" id="statRate">0%</div>
      </div>
      <div class="card">
        <div class="label">Total Interest Paid</div>
        <div class="val" id="statInterest">₹0</div>
      </div>
    </div>

    <!-- Entry Form -->
    <div class="section">
      <h3 id="formTitle">Add Transaction</h3>
      <div class="form-grid">
        <div>
          <label>Type</label>
          <select id="tType">
            <option value="lent">I Lent Money (+)</option>
            <option value="received">I Received Money (-)</option>
          </select>
        </div>
        <div>
          <label>Amount (₹)</label>
          <input type="number" id="tAmount" placeholder="0.00">
        </div>
        <div>
          <label>Date</label>
          <input type="date" id="tDate">
        </div>
        <div>
          <label>Interest Rate % (Annual)</label>
          <input type="number" id="tRate" step="0.1" placeholder="8.5">
        </div>
        <input type="hidden" id="editIdx" value="-1">
        <button onclick="handleTransaction()" id="submitBtn">Save Entry</button>
      </div>
    </div>

    <!-- History -->
    <div class="section">
      <h3>Transaction History</h3>
      <div style="overflow-x: auto;">
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Type</th>
              <th>Amount</th>
              <th>Balance</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="historyBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
  // --- FIREBASE CONFIG ---
  const firebaseConfig = {
    apiKey: "AIzaSyBkI0K87SReSf9QiCsxn1qwmxIFEgzNvd4",
    authDomain: "vaibhav-s-ledger.firebaseapp.com",
    databaseURL: "https://vaibhav-s-ledger-default-rtdb.firebaseio.com",
    projectId: "vaibhav-s-ledger",
    storageBucket: "vaibhav-s-ledger.firebasestorage.app",
    messagingSenderId: "199650798840",
    appId: "1:199650798840:web:06ff1415dd60a603f39f0d"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  let currentPersonId = null;
  let allPeople = {};

  // Initialize
  function init() {
    document.getElementById('tDate').valueAsDate = new Date();
    db.ref('ledger').on('value', snap => {
      allPeople = snap.val() || {};
      renderPersonList();
      if (!currentPersonId && Object.keys(allPeople).length > 0) {
        selectPerson(Object.keys(allPeople)[0]);
      } else if (currentPersonId) {
        updateUI();
      }
    });
  }

  function renderPersonList() {
    const list = document.getElementById('personList');
    list.innerHTML = '';
    Object.keys(allPeople).forEach(id => {
      const div = document.createElement('div');
      div.className = `person-item ${id === currentPersonId ? 'active' : ''}`;
      div.innerText = allPeople[id].name;
      div.onclick = () => selectPerson(id);
      list.appendChild(div);
    });
  }

  function selectPerson(id) {
    currentPersonId = id;
    renderPersonList();
    updateUI();
  }

  function addNewPerson() {
    const name = document.getElementById('newPersonName').value.trim();
    if (!name) return;
    const newRef = db.ref('ledger').push();
    newRef.set({ name: name, transactions: [] });
    document.getElementById('newPersonName').value = '';
  }

  // --- CORE LOGIC: BAJAJ OD RECALCULATION ---
  function updateUI() {
    if (!currentPersonId || !allPeople[currentPersonId]) return;
    
    const person = allPeople[currentPersonId];
    // Filter out previous system-generated interest rows to start fresh
    let userTransactions = (person.transactions || []).filter(t => t.type !== 'interest');
    
    // Sort by date
    userTransactions.sort((a,b) => new Date(a.date) - new Date(b.date));

    // Recalculate everything from scratch (Timeline approach)
    let processedTimeline = [];
    let runningBalance = 0;
    let accumulatedInterest = 0;
    let totalInterestPaid = 0;
    let currentRate = 0;

    if (userTransactions.length > 0) {
      let firstDate = new Date(userTransactions[0].date);
      let today = new Date();
      today.setHours(23, 59, 59);

      let currDate = new Date(firstDate);
      currDate.setHours(0,0,0,0);

      while (currDate <= today) {
        // 1. Check if it's the 1st of the month -> Capitalize Interest
        if (currDate.getDate() === 1 && accumulatedInterest > 0) {
          runningBalance += accumulatedInterest;
          totalInterestPaid += accumulatedInterest;
          processedTimeline.push({
            date: currDate.toISOString().split('T')[0],
            type: 'interest',
            amount: accumulatedInterest,
            balance: runningBalance
          });
          accumulatedInterest = 0;
        }

        // 2. Process any user transactions on this day
        let dayTransactions = userTransactions.filter(t => t.date === currDate.toISOString().split('T')[0]);
        dayTransactions.forEach(t => {
          currentRate = t.rate || currentRate;
          if (t.type === 'lent') runningBalance += t.amount;
          else runningBalance -= t.amount;
          
          processedTimeline.push({...t, balance: runningBalance});
        });

        // 3. Accrue daily interest for today's closing balance (OD style)
        if (runningBalance > 0 && currentRate > 0) {
          accumulatedInterest += runningBalance * (currentRate / 100 / 365);
        }

        currDate.setDate(currDate.getDate() + 1);
      }
    }

    // Display Stats
    document.getElementById('statBalance').innerText = '₹' + Math.round(runningBalance).toLocaleString();
    document.getElementById('statRate').innerText = (currentRate || 0) + '%';
    document.getElementById('statInterest').innerText = '₹' + Math.round(totalInterestPaid).toLocaleString();
    
    // Default rate for form
    document.getElementById('tRate').value = currentRate;

    // Render Table
    const tbody = document.getElementById('historyBody');
    tbody.innerHTML = '';
    processedTimeline.reverse().forEach((t, idx) => {
      const row = tbody.insertRow();
      row.className = t.type === 'interest' ? 'type-interest' : '';
      row.innerHTML = `
        <td>${t.date}</td>
        <td>${t.type === 'lent' ? '➕ Sent' : t.type === 'received' ? '➖ Recv' : '💰 Interest Billed'}</td>
        <td>₹${Math.round(t.amount).toLocaleString()}</td>
        <td>₹${Math.round(t.balance).toLocaleString()}</td>
        <td>
          ${t.type !== 'interest' ? `
            <button class="btn-edit" onclick="editEntry(${userTransactions.indexOf(userTransactions.find(orig => orig.id === t.id))})">Edit</button>
            <button class="btn-del" onclick="deleteEntry(${userTransactions.indexOf(userTransactions.find(orig => orig.id === t.id))})">Del</button>
          ` : '-'}
        </td>
      `;
    });
  }

  function handleTransaction() {
    const type = document.getElementById('tType').value;
    const amount = parseFloat(document.getElementById('tAmount').value);
    const date = document.getElementById('tDate').value;
    const rate = parseFloat(document.getElementById('tRate').value);
    const editIdx = parseInt(document.getElementById('editIdx').value);

    if (!amount || !date || isNaN(rate)) return alert("Fill all fields");

    let person = allPeople[currentPersonId];
    if (!person.transactions) person.transactions = [];
    
    let userT = person.transactions.filter(t => t.type !== 'interest');

    const newEntry = {
      id: editIdx === -1 ? Date.now() : userT[editIdx].id,
      type, amount, date, rate
    };

    if (editIdx === -1) {
      person.transactions.push(newEntry);
    } else {
      // Find the actual index in the original array
      const realIdx = person.transactions.findIndex(t => t.id === newEntry.id);
      person.transactions[realIdx] = newEntry;
    }

    db.ref(`ledger/${currentPersonId}/transactions`).set(person.transactions);
    resetForm();
  }

  function editEntry(idx) {
    const person = allPeople[currentPersonId];
    const userT = person.transactions.filter(t => t.type !== 'interest');
    const entry = userT[idx];

    document.getElementById('tType').value = entry.type;
    document.getElementById('tAmount').value = entry.amount;
    document.getElementById('tDate').value = entry.date;
    document.getElementById('tRate').value = entry.rate;
    document.getElementById('editIdx').value = idx;
    document.getElementById('submitBtn').innerText = "Update Entry";
    document.getElementById('formTitle').innerText = "Editing Transaction";
  }

  function deleteEntry(idx) {
    if (!confirm("Delete this transaction?")) return;
    const person = allPeople[currentPersonId];
    const userT = person.transactions.filter(t => t.type !== 'interest');
    const entryToDelete = userT[idx];
    
    const newTransactions = person.transactions.filter(t => t.id !== entryToDelete.id);
    db.ref(`ledger/${currentPersonId}/transactions`).set(newTransactions);
  }

  function resetForm() {
    document.getElementById('tAmount').value = '';
    document.getElementById('editIdx').value = '-1';
    document.getElementById('submitBtn').innerText = "Save Entry";
    document.getElementById('formTitle').innerText = "Add Transaction";
  }

  init();
</script>
</body>
</html>
